<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Teal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Golden Coin Outer Gradient -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Golden Coin Inner Gradient -->
    <linearGradient id="goldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.45"/>
    </filter>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6"/>

  <!-- Golden Lottery Coin / Medallion -->
  <g filter="url(#coinShadow)">
    <!-- Coin Outer Rim -->
    <circle cx="256" cy="256" r="148" fill="url(#goldOuter)"/>
    <!-- Coin Ridge Pattern -->
    <circle cx="256" cy="256" r="136" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-dasharray="10 6"/>
    <!-- Coin Inner Face -->
    <circle cx="256" cy="256" r="124" fill="url(#goldInner)"/>
  </g>

  <!-- Blossom & Arisan Star Motif in Center of Coin -->
  <!-- 4 Floral Rounded Petals (representing community & harmony) -->
  <g fill="#78350f" opacity="0.9">
    <!-- Top Petal -->
    <path d="M256 168 C240 196 244 218 256 226 C268 218 272 196 256 168 Z"/>
    <!-- Bottom Petal -->
    <path d="M256 344 C240 316 244 294 256 286 C268 294 272 316 256 344 Z"/>
    <!-- Left Petal -->
    <path d="M168 256 C196 240 218 244 226 256 C218 268 196 272 168 256 Z"/>
    <!-- Right Petal -->
    <path d="M344 256 C316 240 294 244 286 256 C294 268 316 272 344 256 Z"/>
  </g>

  <!-- Golden Center Star / Diamond -->
  <path d="M256 208 L269 243 L304 256 L269 269 L256 304 L243 269 L208 256 L243 243 Z" fill="#ffffff"/>
  <circle cx="256" cy="256" r="10" fill="#f59e0b"/>

  <!-- Sparkling Stars (Top Right & Bottom Left) -->
  <!-- Top Right Sparkle -->
  <g transform="translate(390, 110) scale(1.1)">
    <path d="M0 -30 Q0 0 30 0 Q0 0 0 30 Q0 0 -30 0 Q0 0 0 -30 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="6" fill="#fef08a"/>
  </g>
  <!-- Small Star -->
  <circle cx="340" cy="80" r="6" fill="#ffffff" opacity="0.8"/>
  <circle cx="430" cy="170" r="5" fill="#fef08a" opacity="0.75"/>

  <!-- Bottom Left Small Sparkle -->
  <g transform="translate(118, 388) scale(0.75)">
    <path d="M0 -26 Q0 0 26 0 Q0 0 0 26 Q0 0 -26 0 Q0 0 0 -26 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="5" fill="#fef08a"/>
  </g>
</svg>
